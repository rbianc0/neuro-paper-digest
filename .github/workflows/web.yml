name: Web app

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: neurofeed-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://yajsdhpaobqtduazpkkd.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      SUPABASE_SECRET_KEY: sb_secret_build_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OPENAI_API_KEY: sk-build-placeholder
      NEUROFEED_SMTP_USERNAME: build@example.com
      NEUROFEED_SMTP_PASSWORD: build-placeholder
      NEUROFEED_EMAIL_FROM: Neurofeed <build@example.com>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check web app
        working-directory: web
        run: npm run typecheck
      - name: Build production web app
        working-directory: web
        run: npm run build
