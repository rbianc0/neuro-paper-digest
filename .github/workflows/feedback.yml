name: Refresh Neurofeed feedback profiles

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 * * *"

permissions:
  contents: read

concurrency:
  group: neurofeed-feedback-learning
  cancel-in-progress: false

jobs:
  refresh-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: https://yajsdhpaobqtduazpkkd.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Neurofeed backend
        run: pip install .

      - name: Rebuild learned preference centroids
        run: neurofeed-refresh-feedback
