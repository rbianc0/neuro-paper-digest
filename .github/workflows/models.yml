name: Refresh Neurofeed semantic models

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: neurofeed-semantic-models
  cancel-in-progress: false

jobs:
  refresh-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://yajsdhpaobqtduazpkkd.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEUROFEED_EMBEDDING_MODEL: text-embedding-3-small
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Embed new or changed papers
        run: neurofeed-embed-new-papers --batch-size 64 --max-papers 5000
      - name: Refresh declared user models
        run: neurofeed-refresh-user-models
