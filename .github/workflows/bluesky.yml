name: Sync shared Neurofeed Bluesky signals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: neurofeed-shared-bluesky
  cancel-in-progress: false

jobs:
  sync-bluesky:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://yajsdhpaobqtduazpkkd.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Synchronize user follow graphs
        run: neurofeed-sync-follow-graphs
      - name: Fetch stale unique followed accounts
        run: neurofeed-sync-bluesky-accounts --stale-hours 22 --lookback-days 8 --batch-size 1000 --max-workers 8 --max-pages 10
      - name: Resolve social scholarly links
        run: neurofeed-resolve-social-papers --limit 2000
