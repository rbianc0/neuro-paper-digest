name: Weekly newsletter

on:
  workflow_dispatch:
  schedule:
    # Monday morning in Europe. The exact pilot time can be adjusted later.
    - cron: "15 6 * * 1"

concurrency:
  group: neurofeed-weekly-newsletter
  cancel-in-progress: false

jobs:
  generate-and-send:
    # Do not start scheduled delivery until Phase 7 provides a public interaction URL.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.NEUROFEED_PUBLIC_URL != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://yajsdhpaobqtduazpkkd.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NEUROFEED_SUMMARY_MODEL: gpt-5.6-luna
      NEUROFEED_SUMMARY_REASONING_EFFORT: xhigh
      NEUROFEED_PUBLIC_URL: ${{ vars.NEUROFEED_PUBLIC_URL }}
      NEUROFEED_SMTP_HOST: smtp.gmail.com
      NEUROFEED_SMTP_PORT: "587"
      NEUROFEED_SMTP_USERNAME: ${{ vars.NEUROFEED_SMTP_USERNAME }}
      NEUROFEED_SMTP_PASSWORD: ${{ secrets.NEUROFEED_SMTP_PASSWORD }}
      NEUROFEED_EMAIL_FROM: ${{ vars.NEUROFEED_EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Generate immutable weekly digest snapshots
        run: neurofeed-generate-digests
      - name: Send generated digests through Gmail SMTP
        run: neurofeed-send-digests
