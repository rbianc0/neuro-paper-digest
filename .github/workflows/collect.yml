name: Collect weekly neuroscience papers

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to scan
        required: false
        default: "7"
  schedule:
    # 03:37 UTC Monday = 05:37 CEST / 04:37 CET, before the 08:00 Europe/Berlin ChatGPT digest.
    - cron: "37 3 * * 1"

permissions:
  contents: write

concurrency:
  group: weekly-neuro-paper-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: pip install .

      - name: Collect and deduplicate candidates
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          DAYS="${{ github.event.inputs.lookback_days || '7' }}"
          neuro-digest --lookback-days "$DAYS"

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git commit -m "data: update weekly neuroscience candidates"
          git push
