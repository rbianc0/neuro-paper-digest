name: Sync global Neurofeed literature

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Days to ingest
        required: false
        default: "8"
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

concurrency:
  group: neurofeed-global-literature
  cancel-in-progress: false

jobs:
  sync-literature:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Neurofeed collector
        run: pip install .

      - name: Ingest shared literature pool
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SUPABASE_URL: https://yajsdhpaobqtduazpkkd.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: |
          DAYS="${{ github.event.inputs.lookback_days || '8' }}"
          neurofeed-sync-literature \
            --lookback-days "$DAYS" \
            --diagnostic-output data/latest_literature_sync.json

      - name: Upload diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neurofeed-literature-sync
          path: data/latest_literature_sync.json
          if-no-files-found: ignore
          retention-days: 7
