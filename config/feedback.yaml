feedback:
  weights:
    click: 0.25
    save: 1.0
    more_like_this: 1.5
    less_like_this: 1.5

  neutral_less_reasons:
    - already_knew_it

  less_reason_values:
    - wrong_topic
    - wrong_methodology
    - wrong_species
    - too_clinical
    - too_basic
    - already_knew_it
    - not_interesting
    - other

learning:
  # Declared interests remain the anchor. Learned semantic preference starts
  # only after multiple distinct papers carry effective feedback, then ramps
  # toward the 35% ceiling suggested by the MVP specification.
  learned_weight_max: 0.35
  start_after_effective_papers: 2
  full_weight_after_effective_papers: 10
