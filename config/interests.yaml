bluesky:
  enabled: true
  handle: rimbianco.bsky.social
  max_workers: 8
  # Set to an integer for debugging, otherwise scan the full public follow graph.
  max_follows: null
  # Best-effort HTML metadata resolution for scholarly links that do not expose a DOI in the post.
  max_web_resolutions: 60

biorxiv:
  enabled: true
  category: neuroscience

openalex:
  per_query: 50
  general_per_query: 30

  # Semantic/topic discovery queries. These are intentionally overlapping; DOI/title deduplication happens later.
  personal_queries:
    - "MEG EEG intracranial EEG ECoG SEEG source reconstruction beamforming LCMV"
    - "MEG EEG resting state resting-state networks electrophysiology"
    - "neural dynamics dynamical systems nonlinear dynamics latent dynamics neural manifolds state space"
    - "dynamical system reconstruction system identification recurrent neural networks neural data"
    - "normative modelling normative modeling MEG EEG fMRI MRI deviation maps individual abnormality"
    - "representational similarity analysis representational geometry MVPA decoding encoding neuroscience"
    - "fear conditioning fear learning fear generalization extinction neuroscience"
    - "brain body body brain interoception respiration cardiac heartbeat gastric electrogastrography neuroscience"
    - "aperiodic activity spectral exponent 1/f slope excitation inhibition E:I balance EEG MEG"
    - "arousal vigilance pupil neuromodulation state fluctuations neuroscience"
    - "TMS transcranial magnetic stimulation brain stimulation neuroscience"
    - "multiple sclerosis neuroimaging electrophysiology network dynamics biomarkers normative modelling"
    - "auditory neuroscience tinnitus MEG EEG"
    - "predictive processing predictive coding neuroscience"
    - "cluster permutation family wise error mixed effects Bayesian single trial neuroscience methods"

  # High-selectivity venues used only for the broad-discovery lane.
  general_journals:
    - Nature
    - Science
    - Cell
    - Nature Neuroscience
    - Neuron
    - Nature Human Behaviour
    - Current Biology
    - Proceedings of the National Academy of Sciences
    - Science Advances
    - Nature Communications

  general_queries:
    - "brain neuroscience cognition behavior behaviour"
    - "memory learning decision making perception neuroscience"
    - "social cognition emotion human behaviour psychology"
    - "consciousness sleep development aging language neuroscience"
    - "mental health motivation individual differences cognitive neuroscience"
    - "systems neuroscience neural circuits computation"
    - "comparative cognition animal behavior neuroscience"
