embedding:
  model: text-embedding-3-small
  dimensions: 1536
  paper_batch_size: 100

ranking:
  lookback_days: 21
  semantic_candidates: 400
  broad_candidates: 200
  target_papers: 16

  weights:
    semantic: 0.35
    bluesky: 0.30
    fit: 0.10
    quality: 0.10
    broad_discovery: 0.05
    novelty: 0.05
    recency: 0.05

  # Discovery balance is ultimately per-user. This is the onboarding/default
  # split used when a profile has no custom value.
  default_broad_fraction: 0.25

  priority_venues:
    - nature
    - science
    - cell
    - nature neuroscience
    - neuron
    - nature human behaviour
    - current biology
    - proceedings of the national academy of sciences
    - science advances
    - nature communications

features:
  methods:
    meg: [meg, magnetoencephalography]
    eeg: [eeg, electroencephalography]
    intracranial_eeg: [intracranial eeg, ieeg, ecog, electrocorticography, seeg, stereo-eeg]
    fmri: [fmri, functional magnetic resonance]
    mri: [mri, magnetic resonance imaging]
    tms: [tms, transcranial magnetic stimulation]
    electrophysiology: [electrophysiology, local field potential, lfp]
    calcium_imaging: [calcium imaging, two-photon, 2-photon]
    single_cell: [single-cell, single cell, single unit, spike sorting]
    computational_modeling: [computational model, modelling, modeling, dynamical system, state space, neural manifold]

  species:
    human: [human, humans, participant, participants, patient, patients]
    mouse: [mouse, mice, murine]
    rat: [rat, rats]
    drosophila: [drosophila, fruit fly, fruit flies]
    primate: [primate, primates, macaque, macaques, chimpanzee, chimpanzees]
