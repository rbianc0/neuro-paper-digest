# Global acquisition configuration. This file deliberately contains no user
# research profile: users are personalized later over the shared paper pool.

openalex:
  enabled: true
  # OpenAlex field IDs: 28 = Neuroscience, 32 = Psychology.
  # `topics.field.id` includes interdisciplinary works where either field is
  # represented among the work's topics, not only as the primary topic.
  field_ids: [28, 32]
  # Bound the pilot corpus while keeping acquisition global. Increase after
  # measuring weekly volume/API cost rather than adding per-user searches.
  max_records: 5000

biorxiv:
  enabled: true
  category: neuroscience

crossref:
  enabled: true
  # Crossref is enrichment/provenance, not the broad discovery engine.
  max_enrichments: 500

europe_pmc:
  enabled: true
  # Prioritize papers missing abstracts or PMID metadata.
  max_enrichments: 1000
