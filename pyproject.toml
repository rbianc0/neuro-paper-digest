[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-paper-digest"
version = "0.6.0"
description = "Neurofeed shared ingestion, feedback learning, ranking, and newsletter delivery services"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "beautifulsoup4>=4.12,<5",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
neurofeed-sync-literature = "neuro_digest.jobs.sync_literature:main"
neurofeed-sync-follow-graphs = "neuro_digest.jobs.sync_user_follow_graphs:main"
neurofeed-sync-bluesky-accounts = "neuro_digest.jobs.sync_bluesky_accounts:main"
neurofeed-resolve-social-papers = "neuro_digest.jobs.resolve_social_papers:main"
neurofeed-embed-new-papers = "neuro_digest.jobs.embed_new_papers:main"
neurofeed-refresh-user-models = "neuro_digest.jobs.refresh_user_models:main"
neurofeed-refresh-feedback-models = "neuro_digest.jobs.refresh_feedback_models:main"
neurofeed-rank-user = "neuro_digest.jobs.rank_user:main"
neurofeed-generate-weekly-digests = "neuro_digest.jobs.generate_weekly_digests:main"
neurofeed-send-weekly-digests = "neuro_digest.jobs.send_weekly_digests:main"

[tool.setuptools.packages.find]
where = ["src"]
