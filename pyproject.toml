[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-paper-digest"
version = "0.2.0"
description = "Neurofeed global literature ingestion and canonicalization service"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "beautifulsoup4>=4.12,<5",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
neurofeed-sync-literature = "neuro_digest.jobs.sync_literature:main"

[tool.setuptools.packages.find]
where = ["src"]
