[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-paper-digest"
version = "0.1.0"
description = "Deterministic neuroscience paper collector for OpenAlex, bioRxiv, and Bluesky"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "rapidfuzz>=3.9,<4",
  "beautifulsoup4>=4.12,<5",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
neuro-digest = "neuro_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
